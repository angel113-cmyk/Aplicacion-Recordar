<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4F3BF5" />
    <title>Suelta</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Suelta.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app"></div>

    <div id="blazor-error-ui" data-nosnippet>
        Algo salió mal.
        <a href="." class="reload">Volver a abrir</a>
        <span class="dismiss">✕</span>
    </div>

    <script>
        // Lleva la vista hasta la tarjeta del recordatorio cuya notificación se tocó.
        window.suelta = {
            verTarjeta: function (id) {
                var tarjeta = document.getElementById("r-" + id);
                if (tarjeta) tarjeta.scrollIntoView({ block: "center", behavior: "smooth" });
            }
        };
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
